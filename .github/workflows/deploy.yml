name: Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile check
        run: python -m compileall app main.py

      # Render auto-builds on push if the GitHub repo is connected in its
      # dashboard, but that means every push deploys regardless of whether
      # it's actually healthy. Using a Deploy Hook here instead means this
      # step - and therefore the deploy - only fires once the checks above
      # pass, and auto-deploy from push should be turned OFF in the Render
      # dashboard so the two don't race each other.
      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

